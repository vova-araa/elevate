services:
  # Elevate is een TanStack Start + Nitro SSR-app: `vite build` genereert een
  # Node-server in .output/server/index.mjs (geen statische ./dist). Daarom
  # draait dit als een Node web service, niet als static site. `npm ci` kan
  # hier niet (repo pint bun.lock, geen package-lock.json) — dus npm install.
  - type: web
    name: elevate
    runtime: node
    # Starter (of hoger) blijft altijd aan; het gratis type valt na ~15 min
    # inactiviteit in slaapstand en toont dan het "Service waking up"-scherm.
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Server-only geheim: nodig voor admin-server-functions (opslag-overzicht,
      # media opruimen, gebruikers aanmaken). Zonder dit falen die schermen met
      # "Kon niet laden". De code valt voor URL/publishable terug op de VITE_-
      # varianten, maar de service-role key MOET hier gezet worden.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Publieke basis-URL voor OAuth-callbacks (social koppelingen).
      - key: APP_URL
        sync: false
